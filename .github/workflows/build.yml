name: Build

# Debug and Release on GitHub's Ubuntu runner; the tests that don't read the live system are the gate, the Live ones
# run after them, informational (their results depend on the machine), as in WinSysLive's CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v5

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build g++-14 libsystemd-dev pkg-config

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build

      - name: Tests
        run: ./build/Tests -Live

      - name: Live tests (informational)
        continue-on-error: true
        run: ./build/Tests Live
